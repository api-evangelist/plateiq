              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invoices/{id}/flag:
    post:
      operationId: post-invoices-id-flag
      summary: Flag an invoice for review
      description: 'Flags an invoice for review, moving it to incomplete status with a flagging reason.


        ### Features

        - Flags invoice and moves to incomplete status

        - Supports optional flagging reason

        - Triggers notifications to relevant users


        ### Use Cases

        - Flag invoices with issues for review

        - Request corrections or additional information

        - Mark invoices needing manual intervention'
      tags:
      - invoices
      parameters:
      - name: id
        in: path
        description: Invoice ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: OAuth2 authentication flows. Auth server URLs will vary by environment
        required: true
        schema:
          type: string
      - name: X-Api-Key
        in: header
        description: API key for authentication
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        description: 'API version to use (optional, defaults to latest). Supported values: 1.0.0, 1.1.0.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Invoice flagged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoices_post_invoices_id_flag_Response_200'
        '401':
          description: Unauthorized - Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Access denied or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found - Resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: Optional flagging options
        content:
          application/json:
            schema:
              type: object
              properties:
                flagging_reason:
                  type: string
                  description: Reason for flagging the invoice
  /invoices/import:
    post:
      operationId: post-invoices-import
      summary: Bulk import invoices
      description: Asynchronously creates up to 100 invoices in a single request. Each invoice must include a unique `upload_id` and a valid `ottimate_location_id`. Processing is queued via backgrund job and returns a `batch_id` for polling progress and results.
      tags:
      - invoices
      parameters:
      - name: Authorization
        in: header
        description: OAuth2 authentication flows. Auth server URLs will vary by environment
        required: true
        schema:
          type: string
      - name: X-Api-Key
        in: header
        description: API key for authentication
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        description: 'API version to use (optional, defaults to latest). Supported values: 1.0.0, 1.1.0.'
        required: false
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: 'Client-generated unique key (UUID/ULID recommended). JSON requests: the first 2xx response is cached for 24h and replayed on a same-key retry with a matching body; a different body returns 422. Non-JSON requests (e.g. file uploads): the key is single-use — any same-key retry returns 422 regardless of body. See [Idempotency](https://docs.ottimate.com/idempotency) for full details.'
        required: false
        schema:
          type: string
      responses:
        '202':
          description: Bulk import accepted and queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoices_post_invoices_import_Response_202'
        '400':
          description: Bad request - Invalid parameters or request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Access denied or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/InvoicesImportPostRequestBodyContentApplicationJsonSchemaItems'
  /invoices/{id}/images:
    patch:
      operationId: patch-invoices-id-images
      summary: Replace all invoice images with uploaded files
      description: 'Accepts one or more image files via multipart/form-data under the ''images'' key. Deletes all existing images and replaces them with the uploaded files. Supported formats: PDF, JPG, JPEG, PNG. Maximum file size per image: 50 MB. Per-file validation failures are reported in image_errors rather than rejecting the entire request.'
      tags:
      - invoices
      parameters:
      - name: id
        in: path
        description: The unique ID of the invoice
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: OAuth2 authentication flows. Auth server URLs will vary by environment
        required: true
        schema:
          type: string
      - name: X-Api-Key
        in: header
        description: API key for authentication
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        description: 'API version to use (optional, defaults to latest). Supported values: 1.0.0, 1.1.0.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: All images replaced successfully. image_errors is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoices_patch_invoices_id_images_Response_200'
        '400':
          description: Bad request - Invalid parameters or request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Access denied or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found - Resource does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: One or more image files to attach to the invoice
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 'One or more image files to replace existing invoice images. Supported formats: PDF, JPG, JPEG, PNG.'
              required:
              - images
  /invoices/receiver-export:
    get:
      operationId: get-invoices-receiver-export
      summary: Retrieve catalog-matched invoice lines as receiver/quantity export
      description: Returns a paginated list of exported invoices with their catalog-matched line items. Only invoices in exported state, from vendors with item validation enabled, are returned. Fringe catalog entries and unmatched lines are excluded. If an invoice has zero qualifying lines after filtering it is omitted entirely.
      tags:
      - invoices
      parameters:
      - name: ottimate_company_id
        in: query
        description: Ottimate company ID to scope the response
        required: true
        schema:
          type: integer
      - name: ottimate_location_id
        in: query
        description: Ottimate location (restaurant) ID to scope the response
        required: true
        schema:
          type: integer
      - name: exported_after
        in: query
        description: ISO 8601 datetime; returns invoices exported after this timestamp
        required: false
        schema:
          type: string
          format: date-time
      - name: exported_after_utc
        in: query
        description: UTC filter. Accepts ISO 8601 with optional Z/offset, or YYYY-MM-DD[ HH:MM:SS] (assumed UTC). Takes precedence over the non-_utc variant.
        required: false
        schema:
          type: string
          format: date-time
      - name: exported_before
        in: query
        description: ISO 8601 datetime; returns invoices exported before this timestamp
        required: false
        schema:
          type: string
          format: date-time
      - name: exported_before_utc
        in: query
        description: UTC filter. Accepts ISO 8601 with optional Z/offset, or YYYY-MM-DD[ HH:MM:SS] (assumed UTC). Takes precedence over the non-_utc variant.
        required: false
        schema:
          type: string
          format: date-time
      - name: vendor_id
        in: query
        description: Filter by vendor ID
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        description: Max results per page (default 50, max 200)
        required: false
        schema:
          type: integer
      - name: Authorization
        in: header
        description: OAuth2 authentication flows. Auth server URLs will vary by environment
        required: true
        schema:
          type: string
      - name: X-Api-Key
        in: header
        description: API key for authentication
        required: true
        schema:
          type: string
      - name: X-API-Version
        in: header
        description: 'API version to use (optional, defaults to latest). Supported values: 1.0.0, 1.1.0.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Paginated list of receiver export invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoices_get_invoices_receiver-export_Response_200'
        '400':
          description: Bad request - Invalid parameters or request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Access denied or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
