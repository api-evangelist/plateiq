- status: 413
  title: Payload Too Large
  meaning: The uploaded file or request body exceeds allowed size limits.
- status: 422
  title: Unprocessable Entity
  meaning: >-
    Validation failed, or idempotency conflict — same Idempotency-Key replayed
    with a different (mutated) JSON body, or a non-JSON body retried with a reused key.
- status: 409
  title: Conflict
  meaning: A retry arrived while the original request with the same Idempotency-Key is still processing.
- status: 500
  title: Internal Server Error
  meaning: An unexpected server error occurred; retry with backoff and cite request_id if persistent.
notes: >-
  Only 2xx responses are cached by the idempotency layer; 4xx/5xx responses are
  processed fresh on retry. Ottimate is not a payments-decline-code surface — no
  buyer-masked decline code catalog is published.
