- date: '2026-03-05'
  url: https://docs.ottimate.com/changelog/2026/3/5
  breaking: false
  highlights:
  - Purchase Orders and Receipts APIs promoted from in-development to Beta (two-way / three-way matching).
  - PO line items support dimension mappings via the `dimensions` field (keyed by type, e.g. PROJECT, CLASS).
  - Purchase orders support a `custom_fields` object for company-specific metadata.
  - Flexible PO lookup for receipts — by ottimate_po_id or by erp_vendor_id + ottimate_location_id + po_number/po_external_id.
- date: '2026-02-27'
