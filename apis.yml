aid: plateiq
name: PlateIQ
description: >-
  Ottimate (formerly Plate IQ) is an AI-powered accounts payable automation platform for
  restaurants, hospitality, and multi-location businesses. It captures and GL-codes invoices
  with high accuracy via its InstantCapture engine, automates approval workflows and PO/receipt
  matching in Core AP, and sends vendor payments via ACH, check, or virtual card through VendorPay.
  Ottimate exposes a partner-provisioned REST API (OpenAPI 3.1) over JSON with OAuth2
  client-credentials plus API-key auth, idempotent writes, bulk and asynchronous operations, and
  ERP integrations for QuickBooks, NetSuite, Sage Intacct, Acumatica, and Microsoft Dynamics.
