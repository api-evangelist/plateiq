maturity_labels:
- name: Stable
  meaning: Fully production-ready. Covered by SLA and backward-compatibility guarantees.
- name: Generally Available
  meaning: Released to all users; no breaking changes without a versioned migration path.
- name: Beta
  meaning: Available for integration/testing; functionality complete but may change; not yet under SLA.
- name: Pre-release
  meaning: Early access preview; interface and behavior may change significantly.
- name: In Development
  meaning: Visible for planning; not yet available for use.
- name: Deprecated
  meaning: Scheduled for removal; still functions; refer to the changelog for the sunset timeline.
